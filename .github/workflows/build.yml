name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: ./build.ps1 -Test
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: SnipasteLite-windows-portable
          path: SnipasteLite-portable.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SnipasteLite-windows-portable
          path: release
      - name: Publish tagged release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/SnipasteLite-portable.zip --repo $env:GITHUB_REPOSITORY --title "Snipaste Lite $env:GITHUB_REF_NAME" --generate-notes
