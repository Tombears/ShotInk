name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test
        shell: powershell
        run: ./build.ps1 -Test
      - name: Check real OCR and character coordinates
        run: python tests/ocr-benchmark.py --host dist/ocr/ShotInk.OcrHost.exe
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ShotInk-windows-portable
          if-no-files-found: error
          path: |
            dist/ShotInk.exe
            ShotInk-portable.zip
      - name: Upload tool previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShotInk-tool-previews
          if-no-files-found: ignore
          path: build/preview-*-options.png
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: windows-latest
    concurrency:
      group: shotink-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ShotInk-windows-portable
          path: release
      - name: Publish new version or replace current assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-github.ps1 -AssetDirectory ./release
