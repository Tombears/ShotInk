name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: ./build.ps1 -Test
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ShotInk-windows-portable
          if-no-files-found: error
          path: |
            dist/ShotInk.exe
            ShotInk-portable.zip
      - name: Upload tool previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShotInk-tool-previews
          if-no-files-found: ignore
          path: build/preview-*-options.png
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ShotInk-windows-portable
          path: release
      - name: Publish tagged release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = "releases/$env:GITHUB_REF_NAME.md"
          $title = $env:GITHUB_REF_NAME -replace '^v', ''
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          gh release create $env:GITHUB_REF_NAME release/dist/ShotInk.exe release/ShotInk-portable.zip --repo $env:GITHUB_REPOSITORY --verify-tag --latest --title $title --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
